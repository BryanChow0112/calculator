<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <main class="main">
      <div class="calculator">
        <div class="display">
          <div class="previous-display" id="previousDisplay"></div>
          <div class="current-display" id="currentDisplay">0</div>
        </div>
        <div class="keypad">
          <button class="key key-clear span-2" id="clearKey">CLEAR</button>
          <button class="key key-delete span-2" id="deleteKey">DELETE</button>

          <button class="key" data-number>7</button>
          <button class="key" data-number>8</button>
          <button class="key" data-number>9</button>
          <button class="key" data-operator>÷</button>

          <button class="key" data-number>4</button>
          <button class="key" data-number>5</button>
          <button class="key" data-number>6</button>
          <button class="key" data-operator>×</button>

          <button class="key" data-number>1</button>
          <button class="key" data-number>2</button>
          <button class="key" data-number>3</button>
          <button class="key" data-operator>−</button>

          <button class="key" id="decimalKey">.</button>
          <button class="key" data-number>0</button>
          <button class="key" id="equalsKey">=</button>
          <button class="key" data-operator>+</button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>
        Copyright ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        <a href="https://github.com/BryanChow0112" target="_blank"
          >Bryan Chow Wei Qian</a
        >
      </p>
    </footer>
  </body>
</html>
